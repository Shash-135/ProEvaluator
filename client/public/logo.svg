<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="gitToGrade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Dark Background Plate -->
  <rect x="20" y="20" width="160" height="160" rx="40" fill="#0f172a" />

  <!-- Continuous Flowing Ribbon -->
  <!-- Starts as Git node branch (left) -> turns into code angle -> finishes as checkmark (right) -->
  <path d="M 50 115 
           C 50 85, 70 65, 80 80 
           L 95 100 
           L 115 130 
           L 155 70" 
        fill="none" 
        stroke="url(#gitToGrade)" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Git Commit Node on Left Branch -->
  <circle cx="50" cy="115" r="9" fill="#3b82f6" stroke="#ffffff" stroke-width="3" />

  <!-- Milestone Success Point at Check End -->
  <circle cx="155" cy="70" r="7" fill="#10b981" />
</svg>
